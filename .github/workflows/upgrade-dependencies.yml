name: Upgrade dependencies

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    # At 05:00 on day 1 of the month
    - cron: 0 5 1 * *

jobs:
  pixi-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - name: Upgrade dependencies
        run: |
          set -o pipefail
          pixi upgrade --json | pixi exec pixi-diff-to-markdown >> diff.md
      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: upgrade pixi dependencies"
          title: Upgrade pixi dependencies
          body-path: diff.md
          branch: upgrade-pixi
          base: main
          labels: pixi
          delete-branch: true
          add-paths: |
            pixi.toml
            pixi.lock
