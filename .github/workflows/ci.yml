name: ci
on:
  push:
    branches:
      - master
      - main
  workflow_run:
    workflows: ["Update distro tables"]
    types: [completed]
jobs:
  deploy:
    runs-on: ubuntu-latest
    # `ghp-import -p` pushes the built site to the gh-pages branch
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
      - run: pixi run gh-deploy
