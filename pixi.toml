[workspace]
authors = ["Tobias Fischer <info@tobiasfischer.info>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[feature.site.dependencies]
pnpm = ">=11.21.0,<12"
ghp-import = ">=2.1.0,<3"

[feature.site.tasks]
pnpm-install = {
  cmd = "pnpm install",
  description = "Install the site's npm dependencies",
}
serve = {
  cmd = "pnpm run dev",
  depends-on = ["pnpm-install"],
  description = "Serve the site locally",
}
build-docs = {
  cmd = "pnpm run build",
  depends-on = ["pnpm-install"],
  description = "Build the site",
}
gh-deploy = {
  cmd = "ghp-import --no-jekyll --push --force --message 'Deploy site' dist",
  depends-on = ["build-docs"],
  description = "Build the site and publish it to the gh-pages branch",
}

[feature.lint.dependencies]
ruff = ">=0.16,<0.17"
typos = ">=1.49.0,<2"
zizmor = ">=1.29.0,<2"

[feature.lint.tasks]
ruff-check = {
  cmd = "ruff check scripts",
  description = "Lint the scripts in scripts/",
}
format-check = {
  cmd = "ruff format --check scripts",
  description = "Format-check the scripts in scripts/",
}
typos = {
  cmd = "typos",
  description = "Check the repository for typos",
}
zizmor = {
  cmd = "zizmor .github/workflows",
  description = "Lint the GitHub workflows",
}
lint = {
  depends-on = ["ruff-check", "format-check", "typos", "zizmor"],
  description = "Run all lint checks",
}

[feature.scripts.dependencies]
requests = ">=2.34.2,<3"
anaconda-client = ">=1.14.1,<2"
pyyaml = ">=6,<7"
py-rattler = ">=0.25,<0.26"

[feature.scripts.tasks]
compare-completeness = {
  cmd = "python scripts/compare_pkg_completeness.py",
  description = "Add two arguments to give it the DISTRO and CHANNEL",
}

[environments]
default = ["site", "lint", "scripts"]
